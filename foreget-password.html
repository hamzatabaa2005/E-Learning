<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forget password

    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/sign-up.css">

    <style>
        body {
            background-color: rgb(212, 212, 212);

        }
    </style>
</head>



<body>

    <main>
        <div class="container my-5">


            <div class="my-3">
                <form class="  p-3 my-3 card-rounded-md ">
                    <div class="text-center">
                        <h2>Change Password</h2>
                        <p>to change password enter the field .</p>
                    </div>
                    <div class=" my-2">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control " id="email" placeholder="enter your email" required>
                    </div>
                    <div class=" my-2">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter Your password "
                            required>
                    </div>
                    <div class=" my-2">
                        <label for="passwordCheck" class="form-label">password Check</label>
                        <input type="password" class="form-control" id="passwordCheck"
                            placeholder="Enter Your password again for check " required>
                    </div>
                    <div class=" my-2">
                        <button type="submit" class="btn brand-btn w-100">change password</button>
                    </div>

                </form>
            </div>


        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <script src="assets/java/form.js"></script>


</body>

</html>
